<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог домашніх рецептів</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Каталог домашніх рецептів</h1>
  <form id="recipe-form">
    <h2 id="form-title">Новий рецепт</h2>
    <input id="title" placeholder="Назва" required>
    <select id="category" required></select>
    <input id="time" type="number" min="1" placeholder="Час приготування, хв" required>
    <textarea id="ingredients" rows="4" placeholder="Інгредієнти (кожен з нового рядка)" required></textarea>
    <textarea id="description" rows="2" placeholder="Короткий опис"></textarea>
    <div>
      <button type="submit" id="submit-btn">Додати</button>
      <button type="button" id="cancel-btn" hidden>Скасувати</button>
    </div>
  </form>

  <div class="filters">
    <input id="search" type="search" placeholder="Пошук за назвою">
    <select id="filter"></select>
  </div>

  <div id="list"></div>
  <script src="dist/main.js"></script>
</body>
</html>
